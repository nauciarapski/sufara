<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Sufara - offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #faf7f2; color: #16130f; }
    main { max-width: 26rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
    p { margin: 0 0 .75rem; line-height: 1.55; }
    button { font: inherit; font-weight: 600; padding: .55rem 1rem; border-radius: .6rem;
      border: 1px solid #d6d0c6; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Sufara is offline</h1>
    <p>The page could not be loaded because there is no network connection. Pages you have already opened still work.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
